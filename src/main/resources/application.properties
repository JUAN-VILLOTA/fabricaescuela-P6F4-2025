# -------------------------------
# 🔧 CONFIGURACIÓN GENERAL
# -------------------------------
spring.application.name=inventario
# Puerto del servidor (configurable vía variable de entorno)
server.port=${SERVER_PORT:8080}

# -------------------------------
# 🔐 CONFIGURACIÓN JWT (DEBE SER IGUAL AL LOGIN-SERVICE)
# -------------------------------
# Secret para firmar tokens JWT (configurable vía variable de entorno)
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsLongEnough123456789}
# Tiempo de expiración del token en milisegundos (24 horas por defecto)
jwt.expiration=${JWT_EXPIRATION:86400000}

# -------------------------------
# 🌐 CONFIGURACIÓN CORS
# -------------------------------
# Orígenes permitidos para CORS (configurable vía variable de entorno)
# Por defecto permite todos (*) para desarrollo
# En producción, usar dominios específicos: https://tu-frontend.com,https://otro-dominio.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# -------------------------------
# 💾 CONEXIÓN A BASE DE DATOS POSTGRESQL
# -------------------------------
# URL de conexión a PostgreSQL (configurable vía variable de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-small-glitter-addxegoz-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb}
# Usuario de la base de datos (configurable vía variable de entorno)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
# Contraseña de la base de datos (configurable vía variable de entorno)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_ouSG1je7lVsW}
# Driver de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------
# 🔗 CONFIGURACIÓN DE POOL DE CONEXIONES HIKARI
# -------------------------------
# Tamaño máximo del pool de conexiones
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
# Tiempo mínimo de inactividad de una conexión antes de ser cerrada (milisegundos)
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
# Tiempo máximo de vida de una conexión en el pool (milisegundos)
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
# Timeout de conexión (milisegundos)
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}

# -------------------------------
# 📊 CONFIGURACIÓN JPA / HIBERNATE
# -------------------------------
# Especifica el dialecto de PostgreSQL para Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Estrategia DDL de Hibernate (configurable vía variable de entorno)
# Valores: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Muestra las consultas SQL en la consola
spring.jpa.show-sql=true

# Formatea las consultas SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Agrega comentarios SQL para depuración
spring.jpa.properties.hibernate.use_sql_comments=true

# -------------------------------
# 📝 CONFIGURACIÓN DE LOGGING
# -------------------------------
# Nivel de logging general
logging.level.root=INFO

# Logging específico para el paquete de la aplicación
logging.level.com.fabricaescuela=DEBUG

# Logging para Spring Security (ver autenticación)
logging.level.org.springframework.security=DEBUG

# Logging para ver requests HTTP
logging.level.org.springframework.web=DEBUG

# -------------------------------
# 📚 CONFIGURACIÓN SPRINGDOC/SWAGGER
# -------------------------------
# Ruta de la documentación API
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
